<section class="technology-feedback" id="section-technology-feedback" aria-labelledby="title-technology-feedback">
  <div class="technology-feedback__inner">
    <div class="technology-feedback__content">
      <h2 class="technology-feedback__title" id="title-technology-feedback">Хотите дом из газобетона?</h2>
      <p class="technology-feedback__text">Это совсем просто! Назначьте встречу с нашим менеджером и на основании ваших идей мы создадим дом под вас.</p>
      <form class="technology-feedback-form" id="form-technology-feedback" action="#">
        <input class="technology-feedback-form__input" id="technology-feedback-form-tel" name="technology-feedback-form-tel" type="tel" inputmode="tel" placeholder="+7(___)___-__-__" required
          aria-label="Введите номер телефона">
        <button class="technology-feedback-form__button" type="submit">Отправить</button>
      </form>
    </div>
    <div class="technology-feedback__image responsive-media">
      <picture>
        <source srcset="img/images/pages/aerated-concrete/feedback/1.webp" type="image/webp" media="(min-width: 992.1px)">
        <source srcset="img/images/pages/aerated-concrete/feedback/1.jpg" type="image/jpeg" media="(min-width: 992.1px)">
        <source srcset="img/images/pages/aerated-concrete/feedback/2.webp" type="image/webp">
        <img src="img/images/pages/aerated-concrete/feedback/2.jpg" alt="" loading="lazy">
      </picture>
    </div>
  </div>
</section>
